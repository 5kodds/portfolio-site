name: Capture product portfolio screenshots

on:
  push:
    branches: [personal-brand-v1]
    paths:
      - "scripts/capture-product-screens.cjs"
      - ".github/workflows/capture-product-screens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-brand-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Playwright and browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture original websites and public app screens
        run: node scripts/capture-product-screens.cjs
      - name: Commit captured PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/media/
          if ! git diff --cached --quiet; then
            git commit -m "Add authentic high-resolution portfolio screenshots"
            git push origin HEAD:personal-brand-v1
          else
            echo "No updated screenshots"
          fi
